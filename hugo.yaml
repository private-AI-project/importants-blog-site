baseURL: https://blog.importants-studio.com/
languageCode: ko-kr
defaultContentLanguage: ko
title: 혜택줍줍
theme: PaperMod

enableRobotsTXT: true
enableGitInfo: true

services:
  googleAnalytics:
    ID: G-3PDYWLFGSG
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      # 속성값 따옴표를 벗기면 name=msvalidate.01 처럼 점이 든 값을
      # 빙 소유확인 파서가 못 읽는다. 따옴표를 남긴다.
      keepQuotes: true

outputFormats:
  EMBED:
    mediaType: text/html
    baseName: embed
    isHTML: true
    notAlternative: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMS

params:
  env: production
  author: Importants Studio
  title: 혜택줍줍
  description: 정부 지원금·복지 혜택·세금 환급 정보를 알기 쉽게 정리합니다. 신청 조건, 방법, 기간까지 원문 근거와 함께.
  keywords: [지원금, 복지, 세금환급, 연말정산, 정부혜택, 신청방법]
  defaultTheme: auto
  assets:
    favicon: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: false
  ShowToc: true
  TocOpen: false
  ShowShareButtons: true
  disableSpecial1stPost: true
  hideSummary: false

  homeInfoParams:
    Title: 혜택줍줍
    Content: 놓치기 쉬운 정부 지원금·복지 혜택·세금 환급 정보를 줍줍해 드립니다. 모든 글은 정부 발표 원문을 근거로 작성하며, 원문 링크를 함께 제공합니다.

menu:
  main:
    - identifier: posts
      name: 전체 글
      url: /posts/
      weight: 10
    - identifier: tools
      name: 도구
      url: /tools/
      weight: 15
    - identifier: tags
      name: 태그
      url: /tags/
      weight: 20
    - identifier: search
      name: 검색
      url: /search/
      weight: 30
    - identifier: about
      name: 소개
      url: /about/
      weight: 40
    - identifier: contact
      name: 문의
      url: /contact/
      weight: 45
    - identifier: privacy
      name: 개인정보처리방침
      url: /privacy/
      weight: 50

# 태그 페이지는 검색에서 뺀다.
#
# 글 232편에 태그 페이지가 693개고 그중 563개는 글이 한 편만 달려 있다. 그런 페이지의
# 본문은 그 글의 요약문 300~500자가 전부라, 한 글에 태그를 다섯 개 달면 같은 글자가
# 다섯 주소에 들어간다. 애드센스가 "가치가 별로 없는 콘텐츠" 로 막은 상태라 이런 페이지가
# 색인되면 불리하다.
#
# 잃는 것은 거의 없다. 2026-09 기준 28일 검색 노출 942회 중 태그·카테고리 몫이 3회였다.
# 카테고리는 네댓 개뿐이고 글이 여러 편씩 달려 있어 그대로 둔다.
# 페이지 자체는 남으므로 독자가 태그를 눌러 들어오는 길은 그대로다.
cascade:
  - _target:
      path: /tags/**
    robotsNoIndex: true
  - _target:
      kind: taxonomy
      path: /tags
    robotsNoIndex: true

markup:
  goldmark:
    extensions:
      strikethrough: false
    renderer:
      unsafe: false
  highlight:
    noClasses: false
