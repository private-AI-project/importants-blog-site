    <form id="medical-refund-form" class="calc-form">
      <div class="calc-field">
        <label for="tier">건강보험료 소득분위</label>
        <select id="tier" name="tier">
          <option value="b1">1분위 (소득 하위 10%)</option>
          <option value="b2_3">2~3분위</option>
          <option value="b4_5">4~5분위</option>
          <option value="b6_7">6~7분위</option>
          <option value="b8">8분위</option>
          <option value="b9">9분위</option>
          <option value="b10">10분위 (소득 상위 10%)</option>
        </select>
        <p class="calc-hint">모르면 <a href="https://www.nhis.or.kr" target="_blank" rel="noopener">건보공단 누리집</a>에서 확인할 수 있습니다.</p>
      </div>

      <div class="calc-field">
        <label for="paid">2025년 본인부담금 합계 <span>(만원)</span></label>
        <input type="number" id="paid" name="paid" min="0" step="10" placeholder="예: 500" required>
        <p class="calc-hint">건강보험이 적용된 진료의 본인부담금만 해당합니다. 비급여 진료비·상급병실료 차액·임플란트 등은 제외하고 입력하세요.</p>
      </div>

      <div class="calc-field">
        <label for="longTerm">요양병원 120일 초과 입원 여부</label>
        <select id="longTerm" name="longTerm">
          <option value="no">아니오 (일반 입원·외래)</option>
          <option value="yes">예 (요양병원에서 120일 초과 입원)</option>
        </select>
      </div>

      <button type="submit" class="calc-submit">예상 환급액 계산하기</button>
    </form>

    <div id="calc-result" class="calc-result" hidden></div>
