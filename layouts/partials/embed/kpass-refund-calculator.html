    <form id="kpass-form" class="calc-form">
      <div class="calc-field">
        <label for="type">이용자 유형</label>
        <select id="type" name="type">
          <option value="general">일반</option>
          <option value="youth">청년·2자녀·어르신</option>
          <option value="multi">3자녀 이상</option>
          <option value="lowinc">저소득층</option>
        </select>
      </div>

      <div class="calc-field">
        <label for="spend">한 달 대중교통비 <span>(원)</span></label>
        <input type="text" id="spend" name="spend" inputmode="numeric" placeholder="예: 130000" required>
        <p class="calc-hint">버스·지하철·광역버스·GTX 요금을 다 더한 금액입니다. 130,000 처럼 쉼표를 넣어도 됩니다.</p>
      </div>

      <div class="calc-field">
        <label for="rides">한 달 이용 횟수</label>
        <input type="number" id="rides" name="rides" min="0" max="200" step="1" placeholder="예: 40" required>
        <p class="calc-hint">둘째 달부터는 월 15회 이상 타야 환급이 나옵니다.</p>
      </div>

      <div class="calc-field">
        <label for="fare">주로 타는 수단</label>
        <select id="fare" name="fare">
          <option value="normal">시내·마을버스, 지하철 (1회 3천원 미만)</option>
          <option value="plus">광역버스·GTX·신분당선이 섞임 (1회 3천원 이상)</option>
        </select>
        <p class="calc-hint">1회 요금으로 일반형과 플러스형이 갈립니다. 기준금액이 달라 환급액이 크게 바뀝니다.</p>
      </div>

      <div class="calc-field">
        <label for="firstMonth">가입 첫 달인가요</label>
        <select id="firstMonth" name="firstMonth">
          <option value="no">아니요</option>
          <option value="yes">네, 이번 달에 카드를 등록했습니다</option>
        </select>
        <p class="calc-hint">첫 달은 15회를 못 채워도 환급됩니다.</p>
      </div>

      <button type="submit" class="calc-submit">환급액 계산하기</button>
    </form>

    <div id="calc-result" class="calc-result" hidden></div>
